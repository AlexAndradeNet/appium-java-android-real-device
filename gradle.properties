group=com.nuvei
version=1.0.0-SNAPSHOT
description=Appium Java and Android
#----------------GRADLE PERFORMANCE--------------------------------------
# JVM settings for optimal performance
org.gradle.jvmargs=-Xms4g -Xmx16g -XX:+UseParallelGC -XX:MaxMetaspaceSize=2G -Dfile.encoding=UTF-8 -XX:+HeapDumpOnOutOfMemoryError -XX:+TieredCompilation -XX:+UseStringDeduplication
# Enable parallel builds for faster execution
org.gradle.parallel=false
# Enable configuration-on-demand to improve build times
org.gradle.configureondemand=true
# Enable caching to reuse outputs from previous builds
org.gradle.caching=true
# Set the maximum number of workers to the number of cores available on your M1 Pro
org.gradle.workers.max=4
# Adjust daemon behavior for better performance on large memory systems
org.gradle.daemon=false
org.gradle.idletimeout=600000  # Set to 10 minutes (600,000 ms)
# Reduce file watching overhead on macOS
org.gradle.vfs.watch=true
org.gradle.vfs.retained-file-count=5000
# Use native file watching if supported
org.gradle.native=true
# Improve dependency resolution performance
org.gradle.cache.remote.enabled=true
org.gradle.cache.remote.ttl=7d
# Suppress Gradle's performance warnings (optional)
org.gradle.warning.mode=none
# Avoid redundant downloads (Cache dependencies for 24 hours)
org.gradle.cache.expire.seconds=86400
# Set Gradle Wrapper Verification (Security)
org.gradle.wrapper.verification=false
#----------------JAVA PROPERTIES--------------------------------------
# Ensure reproducible builds by locking Java version
java.version=21
javaVersion=21
compileJava.options.encoding="UTF-8"
compileTestJava.options.encoding="UTF-8"
