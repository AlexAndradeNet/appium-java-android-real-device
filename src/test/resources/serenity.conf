serenity {
  project.name = "net-alexandrade-appium-java-android-real-device"
  compromised.on=java.io.FileNotFoundException
  console.colors=true
  enable.markdown=story narrative step
  take.screenshots=FOR_FAILURES
  take.screenshots.for.tasks=AFTER_EACH_STEP
  take.screenshots.for.interactions=FOR_FAILURES
  take.screenshots.for.questions=AFTER_EACH_STEP
  test.root = net.alexandrade.mobile.features.steps
  tag.failures = "true"
  linked.tags = "issue"
  #  logging = "VERBOSE"
  feature.file.encoding=iso-8859-1
}

webdriver {
  driver = appium
  remote.url = "http://localhost:4723"
  autodownload = true
  capabilities {
      platformName = "Android"
      "appium:options" {
            "appium:automationName" = "UiAutomator2"
            "appium:deviceName" = "t650c"
            "appium:appPackage" = "com.nuvei.us"
            "appium:appActivity" = "com.verifone.appModule.splash.view.SplashScreenActivity"
            "appium:newCommandTimeout" = 3600
            "appium:autoGrantPermissions" = true
            "appium:printPageSourceOnFindFailure" = true
            "appium:noReset" = false
      }
  }
}

appium {
  platformName = "Android" // To maintain compability with Serenity
}

serenity {
    generateOutcomes = true     // generate report
}

