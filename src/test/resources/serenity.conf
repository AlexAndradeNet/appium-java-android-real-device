serenity {
  project.name = "com-nuvei-appium-java-android-real-device"
  compromised.on=java.io.FileNotFoundException
  ensure.hard.assertions = true
  implicit.wait = 100  # Reduced implicit wait to 500ms
  console.colors=true
  take.screenshots = FOR_FAILURES # Capture screenshots only on test failure
  fail.on.pending=false # If a example fails, allow other examples to run
  screenshots {
    for {
        each.action = false
        successful.steps = false
    }
  }
  pronouns="he,she,they,it,his,her,their,its"
  feature.file.encoding=UTF-8
  environment = "us"

  # Speed Optimization
  serenity.threads = 1
  serenity.parallel.execution = false
  serenity.parallel.count = 1

  fail.on.no.tests = false
  outputDirectory = "target/site/serenity"
  history.enabled=true
  historyDirectory = "target/site/history"
  preserve.history = true
  record.history = true
  reports {
    show {
      history.charts = true
      step.details = false
    }
  }
  report {
    encoding = UTF-8
    accessibility = true
  }
}

webdriver {
  driver = appium
  reuse.driver = false
  remote.url = "http://localhost:4723"
  autodownload = true
}

# For serenity compatibility with Appium
appium {
  platformName = "Android"
}

environments {
    us {
    webdriver.capabilities {
      platformName = "Android"
      "appium:options" {
            "appium:appPackage" = "com.nuvei.us"
            "appium:appWaitPackage" = "com.nuvei.us"
            "appium:automationName" = "UiAutomator2"
            "appium:deviceName" = "t650c"
            "appium:appActivity" = "com.verifone.appModule.splash.view.SplashScreenActivity"
            "appium:appWaitActivity" = "com.verifone.appModule.splash.view.SplashScreenActivity"
            "appium:newCommandTimeout" = 300
            "appium:noReset" = true
            "appium:fullReset" = false
            "appium:adbExecTimeout" = 60000
            "appium:uiautomator2ServerLaunchTimeout" = 60000
            "appium:disableWindowAnimation" = true
            "appium:skipDeviceInitialization" = true
            "appium:dontStopAppOnReset" = true
            "appium:forceAppLaunch" = true // Force relaunch the app at start
            "appium:skipUnlock" = true
      }
    }
  }
